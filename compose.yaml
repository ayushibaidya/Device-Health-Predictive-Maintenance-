name: device-health-kafka

services:
  kafka-volume-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        for topic in device.telemetry.v1 device.telemetry.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=86400000
        done

  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: device_health
      POSTGRES_USER: device_health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./processing/migrations/001_telemetry_inbox.sql:/docker-entrypoint-initdb.d/001_telemetry_inbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device_health -d device_health"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: processing/Dockerfile
      target: runtime
    entrypoint: ["python", "-m", "device_health_ingestion.migrate"]
    environment: &database-environment
      PGHOST: postgres
      PGDATABASE: device_health
      PGUSER: device_health
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    depends_on:
      postgres:
        condition: service_healthy

  producer:
    profiles: [tools]
    build:
      context: .
      dockerfile: kafka/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer:
    profiles: [tools]
    build:
      context: .
      dockerfile: processing/Dockerfile
      target: runtime
    environment: &consumer-environment
      <<: *database-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: device-telemetry-validation-v1
      REDIS_URL: redis://redis:6379/0
      LATEST_CACHE_TTL_SECONDS: ${LATEST_CACHE_TTL_SECONDS:-30}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  tests:
    profiles: [tools]
    build:
      context: .
      dockerfile: processing/Dockerfile
      target: test
    environment: *consumer-environment
    volumes:
      - ${KAFKA_FIXTURE_DIR:-./build/kafka-integration}:/fixtures:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  kafka-data:
  postgres-data:
