[project]
name = "device-health-ingestion"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["confluent-kafka==2.15.1", "psycopg[binary]==3.3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real Kafka and PostgreSQL services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
